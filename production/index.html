<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOMI PRODUCTION — 준비 중입니다</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="호미 프로덕션 페이지는 현재 준비 중입니다.">
<meta name="theme-color" content="#121212">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#121212;--y:#FFC53D;--mute:rgba(255,255,255,.66)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{word-break:keep-all;background:var(--ink);color:#fff;font-family:'Noto Sans KR','Inter',sans-serif;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;justify-content:space-between;padding:24px clamp(20px,4vw,56px)}
.top a.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:'Inter',sans-serif;font-weight:900;font-size:19px;letter-spacing:-.01em}
.top a.logo img{height:24px;width:auto;display:block}
.top a.back{color:var(--mute);font-size:14px;font-weight:700;text-decoration:none}
.top a.back:hover{color:#fff}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px clamp(20px,4vw,56px) 80px;width:100%}
.brand{font-family:'Inter',sans-serif;font-weight:900;font-size:clamp(15px,1.2vw,18px);letter-spacing:.02em;color:var(--y);margin-bottom:22px}
h1{font-size:clamp(44px,7vw,112px);font-weight:900;line-height:1.02;letter-spacing:-.05em}
p.lead{margin-top:26px;font-size:clamp(16px,1.3vw,19px);line-height:1.65;color:var(--mute);max-width:34em}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 30px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn.y{background:var(--y);color:var(--ink)}
.btn.g{background:rgba(255,255,255,.1);color:#fff}
footer{padding:24px clamp(20px,4vw,56px);font-size:13px;color:rgba(255,255,255,.4)}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head><body>
<header class="top">
  <a class="logo" href="/"><img src="/assets/logo-symbol-white.png" alt=""><span>HOMI FACTORY</span></a>
  <a class="back" href="/">호미팩토리 홈 →</a>
</header>
<main>
  <p class="brand">HOMI PRODUCTION</p>
  <h1>준비 중입니다.</h1>
  <p class="lead">호미 프로덕션 페이지를 새로 준비하고 있어요. 영상 제작 문의는 호미팩토리 상담으로 먼저 남겨 주세요.</p>
  <div class="cta">
    <a class="btn y" href="/contact">무료 상담 받기</a>
    <a class="btn g" href="/">호미팩토리 홈으로</a>
  </div>
</main>
<footer>© HOMI FACTORY</footer>
</body></html>
