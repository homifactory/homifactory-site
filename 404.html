<script id="nf-site">

(function(){
  var p=location.pathname, m=p.match(/^\/(en|ja|id)\/market(\/|$)/), lp=m?'/'+m[1]:'';
  var site=/^\/production(\/|$)/.test(p)?'production':(m||/^\/market(\/|$)/.test(p))?'market':'';
  if(!site) return;
  var C={production:{t:'404 — 페이지를 찾을 수 없습니다 | HOMI PRODUCTION',brand:'HOMI PRODUCTION',home:'/production/',ask:'/production/contact',homeT:'HOMI PRODUCTION 홈으로 →',askT:'제작·대관 문의',

  document.title=C.t; document.body.classList.add('nf-'+site);
  var q=function(s){return document.querySelector(s);};
  q('.nav-logo').href=C.home; q('.brand-word').textContent=C.brand;
  var nc=q('.nav-center'); if(nc) nc.innerHTML=C.links.map(function(l){return '<a href="'+l[1]+'">'+l[0]+'</a>';}).join('');
  q('.nav-cta').href=C.ask; q('.nav-cta').textContent=C.askT;
  q('.nf-btn-primary').href=C.home; q('.nf-btn-primary').textContent=C.homeT;
  q('.nf-btn-ghost').href=C.ask; q('.nf-btn-ghost').textContent=C.askT;
  q('.nf-quick-links').innerHTML=C.links.map(function(l){return '<a href="'+l[1]+'">'+l[0]+'</a>';}).join('');
  if(site==='market') q('.nf-desc').innerHTML='찾으시던 페이지의 주소가 바뀌었거나 없어졌어요.<br>HOMI MARKET 홈으로 돌아가거나 아래 메뉴에서 다시 시작해 보세요.';
  if(site==='production'){
    q('.nf-desc').innerHTML='찾으시던 페이지의 주소가 바뀌었거나 없어졌어요.<br>작품 목록이나 스튜디오 안내에서 다시 시작해 보세요.';
    var st=document.createElement('style');

    document.head.appendChild(st);
  }
})();
